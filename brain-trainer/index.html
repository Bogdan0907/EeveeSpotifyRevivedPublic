<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141b2e"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon.svg">
</head><body>
<title>Synapse Routine</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: lab-notebook app. Sticky tab bar, one column of routine steps, drills run in a full-screen stage. */
:root {
  --bg: #eef1f6;
  --surface: #ffffff;
  --ink: #141b2e;
  --muted: #59637d;
  --line: #d6dce9;
  --accent: #2f4cdd;
  --accent-ink: #ffffff;
  --accent-soft: #e2e7fc;
  --warm: #c86f1c;
  --warm-soft: #fbead8;
  --good: #1d8656;
  --bad: #c33f37;
  --grid: rgba(47, 76, 221, 0.06);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Consolas, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1120; --surface: #141b2e; --ink: #e6eaf5; --muted: #98a2be; --line: #263051;
    --accent: #8197ff; --accent-ink: #0c1120; --accent-soft: #1d2650; --warm: #f0a052; --warm-soft: #3a2a1a;
    --good: #4cc38a; --bad: #f06b62; --grid: rgba(129, 151, 255, 0.05); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1120; --surface: #141b2e; --ink: #e6eaf5; --muted: #98a2be; --line: #263051;
  --accent: #8197ff; --accent-ink: #0c1120; --accent-soft: #1d2650; --warm: #f0a052; --warm-soft: #3a2a1a;
  --good: #4cc38a; --bad: #f06b62; --grid: rgba(129, 151, 255, 0.05); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.55;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
}
body.staged { overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0; }
h2 { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.01em; }
h3 { font-size: 1.12rem; font-weight: 600; }
p { margin: 0; }
a { color: var(--accent); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
kbd { font-family: var(--f-mono); font-size: 0.72em; border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; opacity: 0.7; }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-family: var(--f-mono); font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }

.wrap { max-width: 880px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Header + tabs */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px 0; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 800; font-size: 1.2rem; letter-spacing: -0.02em; }
.brand svg { width: 28px; height: 28px; }
.chips { margin-left: auto; display: flex; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; font-family: var(--f-mono); font-size: 0.8rem; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.chip.warm { background: var(--warm-soft); color: var(--warm); }
.tabs { display: flex; gap: 2px; width: 100%; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { border: 0; background: none; padding: 10px 12px 11px; color: var(--muted); font-weight: 700; font-size: 0.95rem; border-bottom: 3px solid transparent; white-space: nowrap; }
.tab[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }

main .wrap { padding-block: 24px 64px; display: flex; flex-direction: column; gap: 22px; }
.view { display: flex; flex-direction: column; gap: 22px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 16px; font-weight: 700; transition: transform .08s, background .15s; touch-action: manipulation; }
.btn:active { transform: scale(0.97); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: 0.5; cursor: default; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* Today */
.hero { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: end; }
.hero .lead { color: var(--muted); max-width: 60ch; margin-top: 6px; }
.ring { width: 92px; height: 92px; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .lbl { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-mono); font-weight: 600; font-size: 1.05rem; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.step { display: grid; grid-template-columns: 40px 1fr auto; gap: 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; text-align: left; width: 100%; }
.step .idx { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-mono); font-weight: 600; border: 2px solid var(--line); color: var(--muted); }
.step.done .idx { background: var(--good); border-color: var(--good); color: var(--surface); }
.step.next { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.step.next .idx { border-color: var(--accent); color: var(--accent); }
.step .meta { font-size: 0.85rem; color: var(--muted); }
.step .t { font-weight: 700; }
.step .right { text-align: right; font-family: var(--f-mono); font-size: 0.82rem; color: var(--muted); white-space: nowrap; }
.step .right b { display: block; color: var(--ink); font-size: 1rem; }
.pill { display: inline-block; font-family: var(--f-mono); font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; padding: 1px 7px; border-radius: 99px; }
.pill.done { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
.pill.next { background: var(--accent-soft); color: var(--accent); }
.habits { display: flex; flex-direction: column; }
.habit { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: start; padding: 12px 0; border-top: 1px solid var(--line); }
.habit:first-of-type { border-top: 0; }
.habit input { width: 22px; height: 22px; margin-top: 2px; accent-color: var(--good); }
.habit label { font-weight: 700; cursor: pointer; }
.habit .why { font-size: 0.86rem; color: var(--muted); }
.note { font-size: 0.9rem; color: var(--muted); border-left: 3px solid var(--line); padding-left: 12px; max-width: 70ch; }

/* Train */
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.drill { display: flex; flex-direction: column; gap: 10px; }
.drill .top-row { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.drill p { font-size: 0.92rem; color: var(--muted); flex: 1; }
.lvl { font-family: var(--f-mono); font-weight: 600; color: var(--accent); white-space: nowrap; }

/* Progress */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.stat .v { font-family: var(--f-display); font-weight: 800; font-size: 2rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.heat-wrap { overflow-x: auto; }
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 14px); gap: 4px; width: max-content; }
.heat i { width: 14px; height: 14px; border-radius: 3px; background: var(--line); }
.heat i.f { background: var(--accent); }
.heat i.today { outline: 2px solid var(--warm); outline-offset: 1px; }
.legend { display: flex; gap: 6px; align-items: center; font-size: 0.78rem; color: var(--muted); margin-top: 8px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.chart canvas { width: 100%; height: 130px; display: block; }
.chart .head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
textarea, input[type="text"] { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
textarea { font-family: var(--f-mono); font-size: 0.8rem; min-height: 110px; }

/* Cards */
.cardlist { display: flex; flex-direction: column; }
.cl-item { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); align-items: start; }
.cl-item .f { font-weight: 700; }
.cl-item .b { font-size: 0.9rem; color: var(--muted); }
.cl-item .m { font-family: var(--f-mono); font-size: 0.75rem; color: var(--muted); }
.tag { font-family: var(--f-mono); font-size: 0.68rem; background: var(--warm-soft); color: var(--warm); padding: 0 6px; border-radius: 4px; margin-left: 6px; vertical-align: 2px; }
.form { display: grid; gap: 10px; }

/* Science */
.prose { max-width: 68ch; display: flex; flex-direction: column; gap: 12px; }
.prose h3 { margin-top: 10px; }
.verdict { display: grid; gap: 10px; }
.verdict div { display: grid; grid-template-columns: 110px 1fr; gap: 12px; align-items: start; }
.verdict .pill { justify-self: start; margin-top: 3px; }
.pill.strong { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
.pill.mixed { background: var(--warm-soft); color: var(--warm); }
.refs { font-size: 0.86rem; color: var(--muted); padding-left: 20px; display: flex; flex-direction: column; gap: 6px; margin: 0; }
.refs a { word-break: break-word; }

/* Stage */
#stage { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); overflow-y: auto; }
.stage-top { display: flex; align-items: center; gap: 12px; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); background: var(--surface); }
#stageTitle { font-family: var(--f-display); font-weight: 800; font-size: 1.1rem; }
#stageMeta { margin-left: auto; font-family: var(--f-mono); font-size: 0.85rem; color: var(--muted); }
#stageBody { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-block: 20px 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); gap: 18px; }
.intro { max-width: 560px; width: 100%; display: flex; flex-direction: column; gap: 14px; }
.intro ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 0.92rem; color: var(--muted); }
.check input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--accent); }

.nb { display: flex; flex-direction: column; align-items: center; gap: 18px; width: 100%; }
.nb-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: min(320px, 80vw); aspect-ratio: 1; max-width: 100%; }
.nb-cell { border-radius: 10px; background: var(--surface); border: 1px solid var(--line); transition: background .08s; }
.nb-cell.on { background: var(--accent); border-color: var(--accent); }
.nb-letter { font-family: var(--f-display); font-weight: 800; font-size: 2.6rem; height: 3.2rem; min-width: 3rem; text-align: center; }
.nb-btns, .sw-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: min(420px, 100%); }
.btn.big { padding: 18px 10px; font-size: 1.05rem; }
.btn.ok { background: var(--good); color: var(--surface); border-color: var(--good); }
.btn.no { background: var(--bad); color: var(--surface); border-color: var(--bad); }

.sw-card { width: min(300px, 80vw); aspect-ratio: 1.2; max-width: 100%; border-radius: 18px; border: 4px solid var(--line); background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; transition: border-color .1s; }
.sw-card.par { border-color: var(--accent); }
.sw-card.mag { border-color: var(--warm); }
.sw-cue { font-family: var(--f-mono); font-size: 0.85rem; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; }
.sw-card.par .sw-cue { color: var(--accent); }
.sw-card.mag .sw-cue { color: var(--warm); }
.sw-digit { font-family: var(--f-display); font-weight: 800; font-size: 4.6rem; line-height: 1; }
.sw-card.ok { box-shadow: 0 0 0 6px color-mix(in srgb, var(--good) 35%, transparent); }
.sw-card.no { box-shadow: 0 0 0 6px color-mix(in srgb, var(--bad) 35%, transparent); }
.bar { width: min(300px, 80vw); height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 100%; background: var(--accent); }

.mx-q { font-family: var(--f-display); font-weight: 800; font-size: clamp(2.2rem, 9vw, 3.4rem); font-variant-numeric: tabular-nums; }
.mx-a { font-family: var(--f-mono); font-size: 2rem; min-height: 3rem; min-width: 6ch; text-align: center; border-bottom: 3px solid var(--accent); }
.mx-a.no { border-color: var(--bad); color: var(--bad); }
.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: min(320px, 100%); }
.pad button { padding: 14px 0; font-size: 1.3rem; font-family: var(--f-mono); }

.board { position: relative; width: min(340px, 86vw); aspect-ratio: 1; max-width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
.blk { position: absolute; width: 19%; height: 19%; border-radius: 10px; background: var(--accent-soft); border: 2px solid var(--line); padding: 0; transition: background .08s; }
.blk.on { background: var(--warm); border-color: var(--warm); }
.blk.hit { background: var(--accent); border-color: var(--accent); }
.board.locked .blk { cursor: default; }
.sp-msg { font-family: var(--f-display); font-weight: 600; font-size: 1.2rem; min-height: 1.6rem; }

.sr-terms { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; font-family: var(--f-mono); font-size: clamp(1.3rem, 5vw, 1.9rem); font-weight: 600; }
.sr-terms span { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; }
.sr-terms span.q { border-style: dashed; color: var(--accent); border-color: var(--accent); }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: min(420px, 100%); }
.opts button { font-family: var(--f-mono); font-size: 1.3rem; padding: 16px 0; }

.fc { width: min(520px, 100%); min-height: 220px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 24px; display: flex; flex-direction: column; justify-content: center; gap: 14px; text-align: center; }
.fc .front { font-family: var(--f-display); font-weight: 600; font-size: 1.4rem; }
.fc .back { color: var(--muted); border-top: 1px dashed var(--line); padding-top: 14px; }

.breath { width: 220px; height: 220px; max-width: 70vw; max-height: 70vw; border-radius: 50%; background: radial-gradient(circle, var(--accent-soft), transparent 70%); display: grid; place-items: center; }
.breath i { display: block; width: 40%; height: 40%; border-radius: 50%; background: var(--accent); opacity: 0.85; transform: scale(1); transition: transform 4s ease-in-out; }
.breath-t { font-family: var(--f-mono); font-size: 1.6rem; }

.res { max-width: 520px; width: 100%; display: flex; flex-direction: column; gap: 16px; }
.res-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.res-stats div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.res-stats b { display: block; font-family: var(--f-display); font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.lvl-msg { padding: 12px 14px; border-radius: 12px; font-weight: 700; }
.lvl-msg.up { background: color-mix(in srgb, var(--good) 15%, transparent); color: var(--good); }
.lvl-msg.down { background: var(--warm-soft); color: var(--warm); }
.lvl-msg.same { background: var(--accent-soft); color: var(--accent); }

@media (max-width: 520px) {
  .hero { grid-template-columns: 1fr; }
  .ring { width: 76px; height: 76px; }
  .verdict div { grid-template-columns: 1fr; gap: 4px; }
  h2 { font-size: 1.4rem; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="8" cy="9" r="4" fill="var(--accent)"/><circle cx="24" cy="9" r="4" fill="var(--warm)"/><circle cx="16" cy="24" r="4" fill="var(--accent)"/><path d="M8 9 L16 24 L24 9" stroke="var(--ink)" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      Synapse Routine
    </div>
    <div class="chips">
      <span class="chip warm" id="chipStreak" title="Days in a row with the full routine done">0-day streak</span>
      <span class="chip" id="chipToday">0/5 today</span>
    </div>
    <nav class="tabs" aria-label="Sections">
      <button class="tab" data-view="today">Today</button>
      <button class="tab" data-view="train">Drills</button>
      <button class="tab" data-view="progress">Progress</button>
      <button class="tab" data-view="cards">Cards</button>
      <button class="tab" data-view="science">Science</button>
    </nav>
  </div>
</header>

<main><div class="wrap">
  <section class="view" id="v-today"></section>
  <section class="view" id="v-train" hidden></section>
  <section class="view" id="v-progress" hidden></section>
  <section class="view" id="v-cards" hidden></section>
  <section class="view" id="v-science" hidden></section>
</div></main>

<div id="stage" hidden role="dialog" aria-modal="true" aria-labelledby="stageTitle">
  <div class="stage-top">
    <button class="btn ghost" id="stageClose">Quit</button>
    <div id="stageTitle"></div>
    <div id="stageMeta"></div>
  </div>
  <div id="stageBody"></div>
</div>

<script>
(function () {
"use strict";
/* ---------- helpers ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = x => Math.round(x * 100) + "%";
const mean = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : 0;
function iso(dt) { return dt.getFullYear() + "-" + String(dt.getMonth() + 1).padStart(2, "0") + "-" + String(dt.getDate()).padStart(2, "0"); }
function today() { return iso(new Date()); }
function addDays(s, k) { const [y, m, d] = s.split("-").map(Number); return iso(new Date(y, m - 1, d + k)); }
function dayNum(s) { const [y, m, d] = s.split("-").map(Number); return Math.floor(Date.UTC(y, m - 1, d) / 864e5); }

/* ---------- content ---------- */
const DRILLS = {
  nback:  { name: "Dual N-Back",    skill: "Working memory",       mins: 8, unit: "N",      desc: "Track grid positions and letters at the same time. Respond when either matches the one N steps back. Difficulty adapts every round." },
  "switch": { name: "Rule Switch",  skill: "Cognitive flexibility", mins: 2, unit: "level",  desc: "Sort digits as odd/even or low/high depending on the colour cue. The rule changes without warning, and the time limit tightens as you improve." },
  math:   { name: "Number Sprint",  skill: "Processing speed",     mins: 1, unit: "level",  desc: "60 seconds of mental arithmetic. Problems move from single digits to two-digit multiplication as you get faster." },
  span:   { name: "Block Span",     skill: "Visuospatial memory",  mins: 3, unit: "blocks", desc: "Watch blocks light up, then tap them back in the same order. Based on the Corsi block-tapping test." },

function dayFrac(d) { const r = S.days[d]; if (!r) return 0; const p = planFor(d); return p.filter(id => r.done[id]).length / p.length; }

function drawCharts() {
  const cs = getComputedStyle(document.documentElement);
  const accent = cs.getPropertyValue("--accent").trim(), line = cs.getPropertyValue("--line").trim(), muted = cs.getPropertyValue("--muted").trim(), warm = cs.getPropertyValue("--warm").trim();
  $$("canvas[data-chart]").forEach(cv => {
    const id = cv.dataset.chart, h = S.history.filter(x => x.t === id).slice(-40);
    const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
    if (!W) return;
    cv.width = W * dpr; cv.height = H * dpr;
    const g = cv.getContext("2d"); g.scale(dpr, dpr); g.clearRect(0, 0, W, H);
    const vals = h.map(x => x.lvl), lo = Math.max(0, Math.min.apply(null, vals) - 1), hi = Math.max.apply(null, vals) + 1;
    const pl = 26, pr = 10, pt = 8, pb = 8;
    const X = i => pl + (h.length === 1 ? (W - pl - pr) / 2 : i * (W - pl - pr) / (h.length - 1));
    const Y = v => pt + (hi - v) * (H - pt - pb) / (hi - lo);
    g.font = "11px " + cs.getPropertyValue("--f-mono"); g.fillStyle = muted; g.strokeStyle = line; g.lineWidth = 1; g.textBaseline = "middle"; g.textAlign = "right";
    const stepV = Math.max(1, Math.ceil((hi - lo) / 4));
    for (let v = Math.ceil(lo); v <= hi; v += stepV) { g.beginPath(); g.moveTo(pl, Y(v)); g.lineTo(W - pr, Y(v)); g.stroke(); g.fillText(v, pl - 6, Y(v)); }
    g.beginPath(); vals.forEach((v, i) => i ? g.lineTo(X(i), Y(v)) : g.moveTo(X(i), Y(v)));
    g.lineTo(X(vals.length - 1), H - pb); g.lineTo(X(0), H - pb); g.closePath(); g.globalAlpha = 0.14; g.fillStyle = accent; g.fill(); g.globalAlpha = 1;
    g.beginPath(); vals.forEach((v, i) => i ? g.lineTo(X(i), Y(v)) : g.moveTo(X(i), Y(v))); g.strokeStyle = accent; g.lineWidth = 2.5; g.lineJoin = "round"; g.stroke();
    const li = vals.length - 1; g.beginPath(); g.arc(X(li), Y(vals[li]), 4.5, 0, 7); g.fillStyle = warm; g.fill();
  });
}

      <div><span class="pill strong">Strong</span><p><b>Sleep.</b> Short sleep measurably harms attention, working memory and speed. Your training is worth less on a bad night.</p></div>
      <div><span class="pill strong">Good</span><p><b>Aerobic exercise.</b> Improves executive function. In one trial a year of walking grew the hippocampus by about 2 percent.</p></div>
      <div><span class="pill mixed">Mixed</span><p><b>Dual n-back.</b> The 2008 study reported gains in fluid intelligence. Later meta-analyses disagree: one finds a small positive effect, another finds near transfer to similar memory tasks but little reliable far transfer.</p></div>
      <div><span class="pill mixed">Mixed</span><p><b>Brain-training games in general.</b> A large 2016 review found good evidence that people improve on trained tasks, less evidence for closely related tasks, and little for everyday cognition.</p></div>
      <div><span class="pill mixed">Mixed</span><p><b>Mindfulness.</b> Short programs have improved working memory and test scores, though effect sizes vary between studies.</p></div>
    </div>
    <h3>How the routine uses this</h3>
    <p><b>Adaptive difficulty.</b> Every drill keeps you near the point where you get about 80 to 90 percent right. Dual n-back uses the original study's rule: fewer than 3 errors in each stream moves you up, more than 5 in either moves you down.</p>
    <p><b>Variety.</b> Executive function training transfers best when it is varied and keeps getting harder (Diamond & Ling 2016), so two drills rotate each day across flexibility, speed, spatial memory and reasoning.</p>
    <p><b>Short daily sessions.</b> Studies that found effects used roughly 20 minutes a day, most days, for several weeks. A daily streak builds that habit.</p>
    <p><b>Habits sit beside the drills</b> because they have the stronger evidence. Treat the drills as attention practice and the habits as the main event.</p>
    <h3>Where each drill comes from</h3>
    <p><b>Dual N-Back:</b> the Jaeggi 2008 task with 20 + N trials per block and 3 seconds per trial. <b>Rule Switch:</b> the classic odd/even and high/low task-switching paradigm (Monsell 2003). <b>Block Span:</b> a digital Corsi block-tapping test. <b>Pattern Series:</b> number-series items like those used in fluid reasoning tests. <b>Number Sprint:</b> timed arithmetic fluency.</p>
    <h3>References</h3>

  </div>`;
}

/* ---------- stage ---------- */
let timers = [], keyHandler = null, wakeLock = null;

  try { navigator.wakeLock && navigator.wakeLock.request("screen").then(w => { wakeLock = w; }, () => {}); } catch (e) {}
}
function closeStage() { clearTimers(); $("#stage").hidden = true; document.body.classList.remove("staged"); $("#stageBody").innerHTML = ""; try { wakeLock && wakeLock.release(); } catch (e) {} wakeLock = null; }

function results(id, stats, change, note) {

  const msgs = { up: "Level up. Next round is harder.", down: "Easing off one level so you can consolidate.", same: "Holding this level. Aim for fewer errors next time." };

    <div class="row">${next ? `<button class="btn primary big" id="rNext">Next: ${stepName(next)}</button>` : ""}<button class="btn big" id="rDone">${next ? "Back to today" : "Finish"}</button></div></div>`);

function adapt(id, up, down, min, max) {
  const old = S.levels[id]; let nl = old;

/* ---------- drill: dual n-back ---------- */
function runNback() {
  openStage("Dual N-Back");
  const n = S.levels.nback, total = 20 + n;
  const canSpeak = "speechSynthesis" in window;
  intro(`<div class="eyebrow">Working memory · ${n}-back</div><h2>Match what you saw and heard ${n} step${n > 1 ? "s" : ""} ago</h2>
    <ul><li>Every 3 seconds a square lights up and a letter plays.</li>
    <li>Press <b>Position</b> (key <kbd>A</kbd>) when the square is in the same place as ${n} step${n > 1 ? "s" : ""} back.</li>
    <li>Press <b>Letter</b> (key <kbd>L</kbd>) when the letter is the same as ${n} step${n > 1 ? "s" : ""} back.</li>
    <li>Both can match at once, or neither. ${total} trials, about ${Math.ceil(total * 3 / 60)} minutes.</li></ul>
    <label class="check"><input type="checkbox" id="nbSpeak" ${canSpeak ? "checked" : "disabled"}> Speak letters aloud. Recommended, since hearing and seeing use separate memory stores. Turn off to show letters on screen instead.</label>`,
    () => play(canSpeak && $("#nbSpeak").checked));
  function play(speak) {
    const LET = "CHKLQRST";
    const gen = (arr, i, max) => { if (i >= n && Math.random() < 0.3) return arr[i - n]; let v; do { v = Math.floor(Math.random() * max); } while (i >= n && v === arr[i - n]); return v; };
    const P = [], A = [];
    for (let i = 0; i < total; i++) { P.push(gen(P, i, 9)); A.push(gen(A, i, LET.length)); }
    const rp = [], ra = [];
    body(`<div class="nb"><div class="nb-grid">${'<div class="nb-cell"></div>'.repeat(9)}</div>
      <div class="nb-letter" id="nbLetter" ${speak ? "hidden" : ""}></div>
      <div class="nb-btns"><button class="btn big" id="bP">Position <kbd>A</kbd></button><button class="btn big" id="bA">Letter <kbd>L</kbd></button></div></div>`);
    const cells = $$(".nb-cell");
    let i = -1;
    const press = kind => {
      if (i < n || i >= total) return;
      const arr = kind === "p" ? rp : ra; if (arr[i]) return; arr[i] = true;
      const src = kind === "p" ? P : A, ok = src[i] === src[i - n], b = $(kind === "p" ? "#bP" : "#bA");
      b.classList.add(ok ? "ok" : "no"); later(() => b.classList.remove("ok", "no"), 350);
    };
    $("#bP").onclick = () => press("p"); $("#bA").onclick = () => press("a");
    keyHandler = e => { const k = e.key.toLowerCase(); if (k === "a") press("p"); else if (k === "l") press("a"); };
    const step = () => {
      i++;
      if (i >= total) return end();
      meta(`Trial ${i + 1} / ${total}`);
      const cur = i;
      later(() => {
        cells[P[cur]].classList.add("on");
        const letter = LET[A[cur]];
        if (speak) { try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(letter); u.rate = 1; speechSynthesis.speak(u); } catch (e) {} }
        else $("#nbLetter").textContent = letter;
        later(() => { cells[P[cur]].classList.remove("on"); if (!speak) $("#nbLetter").textContent = ""; }, 500);
      }, 80);
      later(step, 3000);
    };
    meta("Get ready"); later(step, 1000);
    function end() {
      let eP = 0, eA = 0, hitP = 0, hitA = 0, tP = 0, tA = 0;
      for (let j = n; j < total; j++) {
        const mp = P[j] === P[j - n], ma = A[j] === A[j - n];
        if (mp) tP++; if (ma) tA++;
        if (mp !== !!rp[j]) eP++; else if (mp) hitP++;
        if (ma !== !!ra[j]) eA++; else if (ma) hitA++;
      }
      const acc = 1 - (eP + eA) / (2 * (total - n));
      const ch = adapt("nback", eP < 3 && eA < 3, eP > 5 || eA > 5, 1, 12);
      finish("nback", { lvl: n, acc: acc });
      results("nback", [["Level", n + "-back"], ["Accuracy", pct(acc)], ["Position errors", eP], ["Letter errors", eA], ["Position hits", hitP + "/" + tP], ["Letter hits", hitA + "/" + tA]], ch, "Next round: " + S.levels.nback + "-back.");
    }
  }
}

/* ---------- drill: rule switch ---------- */
function runSwitch() {
  openStage("Rule Switch");
  const L = S.levels["switch"], deadline = Math.max(900, 3200 - 250 * (L - 1)), total = 32;
  intro(`<div class="eyebrow">Cognitive flexibility · level ${L}</div><h2>Follow the cue, not the habit</h2>
    <ul><li><b style="color:var(--accent)">Blue frame:</b> is the digit odd or even?</li>
    <li><b style="color:var(--warm)">Orange frame:</b> is it lower or higher than 5?</li>
    <li>Left button (<kbd>F</kbd> or <kbd>←</kbd>) means <b>odd / low</b>. Right button (<kbd>J</kbd> or <kbd>→</kbd>) means <b>even / high</b>.</li>
    <li>${total} digits. You have ${(deadline / 1000).toFixed(2)} seconds each. Be fast and accurate.</li></ul>`, play);
  function play() {
    const log = []; let i = -1, rule = null, digit = 0, t0 = 0, waiting = false, tid = null;
    body(`<div class="sw-card" id="swCard"><span class="sw-cue" id="swCue"></span><span class="sw-digit" id="swDigit"></span></div>
      <div class="bar"><i id="swBar"></i></div>
      <div class="sw-btns"><button class="btn big" id="bL">◀ Odd · Low</button><button class="btn big" id="bR">Even · High ▶</button></div>`);
    const card = $("#swCard"), bar = $("#swBar");
    $("#bL").onclick = () => respond("L"); $("#bR").onclick = () => respond("R");
    keyHandler = e => { const k = e.key.toLowerCase(); if (k === "f" || k === "arrowleft") respond("L"); else if (k === "j" || k === "arrowright") respond("R"); };
    function next() {
      i++; if (i >= total) return end();
      meta(`${i + 1} / ${total}`);
      const prev = rule; rule = prev === null ? pick(["par", "mag"]) : (Math.random() < 0.4 ? (prev === "par" ? "mag" : "par") : prev);
      digit = pick([1, 2, 3, 4, 6, 7, 8, 9]);
      card.className = "sw-card " + rule;
      $("#swCue").textContent = rule === "par" ? "Odd or even?" : "Low or high?";
      $("#swDigit").textContent = digit;
      bar.style.transition = "none"; bar.style.width = "100%"; void bar.offsetWidth;
      bar.style.transition = `width ${deadline}ms linear`; bar.style.width = "0%";
      t0 = performance.now(); waiting = true;
      log.push({ sw: prev !== null && prev !== rule, first: prev === null });
      tid = later(() => respond(null), deadline);
    }
    function respond(side) {
      if (!waiting) return; waiting = false; clearTimeout(tid);
      const want = rule === "par" ? (digit % 2 ? "L" : "R") : (digit < 5 ? "L" : "R");
      const ok = side === want, e = log[log.length - 1];
      e.ok = ok; e.rt = performance.now() - t0;
      card.classList.add(ok ? "ok" : "no");
      $("#swDigit").textContent = ok ? digit : side === null ? "Time" : digit;
      later(() => { card.classList.remove("ok", "no"); next(); }, ok ? 250 : 650);
    }
    later(next, 600);
    function end() {
      const correct = log.filter(x => x.ok).length, acc = correct / total;
      const rRep = log.filter(x => x.ok && !x.sw && !x.first).map(x => x.rt), rSw = log.filter(x => x.ok && x.sw).map(x => x.rt);
      const cost = rRep.length && rSw.length ? Math.round(mean(rSw) - mean(rRep)) : null;
      const ch = adapt("switch", acc >= 0.9, acc < 0.75, 1, 10);
      finish("switch", { lvl: L, acc: acc });
      results("switch", [["Accuracy", pct(acc)], ["Avg time", Math.round(mean(log.filter(x => x.ok).map(x => x.rt)) || 0) + " ms"], ["Switch cost", cost === null ? "–" : cost + " ms"]], ch,
        "Switch cost is how much slower you are right after the rule changes. A smaller number means more flexible control.");
    }
  }
}

/* ---------- drill: number sprint ---------- */
function mathProblem(L) {
  const k = pick({ 1: ["a1"], 2: ["a2s", "s2s"], 3: ["a2", "s2"], 4: ["m"], 5: ["m21", "d"], 6: ["m22", "a3", "s3"], 7: ["m22", "d", "sq", "m21"] }[Math.min(L, 7)]);
  let a, b;
  switch (k) {
    case "a1": a = rand(1, 9); b = rand(1, 9); return { q: `${a} + ${b}`, a: a + b };
    case "a2s": a = rand(10, 89); b = rand(2, 9); return { q: `${a} + ${b}`, a: a + b };
    case "s2s": a = rand(12, 99); b = rand(2, 9); return { q: `${a} − ${b}`, a: a - b };
    case "a2": a = rand(11, 89); b = rand(11, 89); return { q: `${a} + ${b}`, a: a + b };
    case "s2": a = rand(30, 99); b = rand(11, a - 1); return { q: `${a} − ${b}`, a: a - b };
    case "m": a = rand(2, 12); b = rand(2, 12); return { q: `${a} × ${b}`, a: a * b };
    case "m21": a = rand(12, 49); b = rand(3, 9); return { q: `${a} × ${b}`, a: a * b };
    case "d": b = rand(3, 12); a = b * rand(3, 15); return { q: `${a} ÷ ${b}`, a: a / b };
    case "m22": a = rand(11, 29); b = rand(11, 19); return { q: `${a} × ${b}`, a: a * b };
    case "a3": a = rand(120, 899); b = rand(110, 899); return { q: `${a} + ${b}`, a: a + b };
    case "s3": a = rand(300, 999); b = rand(110, a - 50); return { q: `${a} − ${b}`, a: a - b };
    case "sq": a = rand(11, 25); return { q: `${a}²`, a: a * a };
  }
}
function runMath() {
  openStage("Number Sprint");
  const L = S.levels.math, secs = 60;
  intro(`<div class="eyebrow">Processing speed · level ${L}</div><h2>Solve as many as you can in 60 seconds</h2>
    <ul><li>Type the answer with the keypad or your keyboard. It checks itself once you have typed enough digits.</li>
    <li>Use <b>Skip</b> (or <kbd>Enter</kbd>) to pass on a problem. Skips count as misses.</li>
    <li>15 or more correct at 90% accuracy moves you up a level.</li></ul>`, play);
  function play() {
    let p = mathProblem(L), entry = "", correct = 0, wrong = 0, endAt = performance.now() + secs * 1000, over = false;
    body(`<div class="mx-q" id="mxQ"></div><div class="mx-a" id="mxA"></div>
      <div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(d => `<button class="btn" data-k="${d}">${d}</button>`).join("")}<button class="btn" data-k="back" aria-label="Delete">⌫</button><button class="btn" data-k="0">0</button><button class="btn" data-k="skip">Skip</button></div>`);
    const show = () => { $("#mxQ").textContent = p.q + " ="; $("#mxA").textContent = entry || " "; };
    const nextP = () => { let np; do { np = mathProblem(L); } while (np.q === p.q); p = np; entry = ""; show(); };
    const key = k => {
      if (over) return;
      if (k === "back") { entry = entry.slice(0, -1); show(); return; }
      if (k === "skip") { wrong++; nextP(); return; }
      entry += k; show();
      const want = String(p.a);
      if (entry === want) { correct++; nextP(); }
      else if (entry.length >= want.length) { wrong++; const a = $("#mxA"); a.classList.add("no"); over = true; later(() => { a.classList.remove("no"); over = false; nextP(); }, 400); }
    };
    $$("[data-k]").forEach(b => b.onclick = () => key(b.dataset.k));
    keyHandler = e => { if (/^[0-9]$/.test(e.key)) key(e.key); else if (e.key === "Backspace") key("back"); else if (e.key === "Enter") key("skip"); };
    show();
    const tick = () => { const left = Math.max(0, Math.ceil((endAt - performance.now()) / 1000)); meta(`${left}s · ${correct} correct`); if (left <= 0) return end(); later(tick, 200); };
    tick();
    function end() {
      over = true; keyHandler = null;
      const acc = correct + wrong ? correct / (correct + wrong) : 0;
      const ch = adapt("math", correct >= 15 && acc >= 0.9, correct < 6 || acc < 0.7, 1, 7);
      finish("math", { lvl: L, acc: acc, score: correct });
      results("math", [["Correct", correct], ["Accuracy", pct(acc)], ["Per minute", correct]], ch);
    }
  }
}

/* ---------- drill: block span (Corsi) ---------- */
function runSpan() {
  openStage("Block Span");
  let span = Math.min(9, Math.max(2, S.levels.span));
  const trials = 8;
  intro(`<div class="eyebrow">Visuospatial memory · starts at ${span} blocks</div><h2>Repeat the sequence</h2>
    <ul><li>Blocks light up one at a time. Watch the order.</li>
    <li>When it says <b>Your turn</b>, tap them in the same order.</li>
    <li>Get it right and the next sequence is one longer. Miss twice in a row and it gets one shorter. ${trials} sequences in total.</li></ul>`, play);
  function play() {
    const slots = shuffle([...Array(16).keys()]).slice(0, 9);
    body(`<div class="sp-msg" id="spMsg">Watch</div><div class="board locked" id="board">${slots.map((s, i) => { const r = Math.floor(s / 4), c = s % 4; return `<button class="blk" data-b="${i}" style="left:${3 + c * 24 + rand(0, 2)}%;top:${3 + r * 24 + rand(0, 2)}%" aria-label="Block ${i + 1}"></button>`; }).join("")}</div>`);
    const blocks = $$(".blk"), board = $("#board"), msg = $("#spMsg");
    let t = 0, best = 0, fails = 0, seq = [], pos = 0, input = false;
    blocks.forEach(b => b.onclick = () => tap(+b.dataset.b));
    function trial() {
      if (t >= trials) return end();
      t++; meta(`Sequence ${t} / ${trials} · ${span} blocks`);
      seq = shuffle([...Array(9).keys()]).slice(0, span); pos = 0; input = false;
      board.classList.add("locked"); msg.textContent = "Watch";
      seq.forEach((b, k) => { later(() => blocks[b].classList.add("on"), 700 + k * 900); later(() => blocks[b].classList.remove("on"), 700 + k * 900 + 650); });
      later(() => { input = true; board.classList.remove("locked"); msg.textContent = "Your turn"; }, 700 + seq.length * 900);
    }
    function tap(b) {
      if (!input) return;
      blocks[b].classList.add("hit"); later(() => blocks[b].classList.remove("hit"), 220);
      if (b !== seq[pos]) { input = false; fails++; msg.textContent = "Not quite"; if (fails >= 2) { span = Math.max(2, span - 1); fails = 0; } later(trial, 1100); return; }
      pos++;
      if (pos === seq.length) { input = false; best = Math.max(best, span); fails = 0; msg.textContent = "Correct"; span = Math.min(9, span + 1); later(trial, 900); }
    }
    later(trial, 300);
    function end() {
      const old = S.levels.span; S.levels.span = Math.max(3, Math.min(9, best ? best : span));
      const ch = S.levels.span > old ? "up" : S.levels.span < old ? "down" : "same";
      finish("span", { lvl: best || span - 1, acc: null });
      results("span", [["Longest sequence", best || "–"], ["Next start", S.levels.span + " blocks"]], ch, "Typical adult forward span is about 5 to 7 blocks.");
    }
  }
}

/* ---------- drill: pattern series ---------- */
const SERIES = {
  arith: () => { const neg = Math.random() < 0.3, d = rand(2, 9) * (neg ? -1 : 1), s = neg ? rand(50, 90) : rand(1, 20); return [0, 1, 2, 3, 4, 5].map(k => s + k * d); },
  geo: () => { const s = rand(1, 5), m = rand(2, 3); return [0, 1, 2, 3, 4, 5].map(k => s * Math.pow(m, k)); },
  incr: () => { let v = rand(1, 10), d = rand(1, 4); const st = rand(1, 3), o = [v]; for (let k = 0; k < 5; k++) { v += d; d += st; o.push(v); } return o; },
  inter: () => { const a = rand(1, 10), da = rand(2, 5), b = rand(20, 40), db = -rand(1, 4); return [0, 1, 2, 3, 4, 5, 6].map(k => k % 2 ? b + ((k - 1) / 2) * db : a + (k / 2) * da); },
  fib: () => { const o = [rand(1, 5), rand(2, 7)]; while (o.length < 7) o.push(o[o.length - 1] + o[o.length - 2]); return o; },
  sq: () => { const c = rand(-3, 5), s = rand(1, 4); return [0, 1, 2, 3, 4, 5].map(k => (s + k) * (s + k) + c); },
  affine: () => { let v = rand(1, 4); const m = 2, c = rand(1, 3), o = [v]; for (let k = 0; k < 5; k++) { v = v * m + c; o.push(v); } return o; },
  altop: () => { let v = rand(1, 6); const a = rand(2, 5), m = rand(2, 3), o = [v]; for (let k = 0; k < 6; k++) { v = k % 2 ? v * m : v + a; o.push(v); } return o; },
  dbl: () => { let v = rand(1, 9), d = rand(1, 3); const o = [v]; for (let k = 0; k < 5; k++) { v += d; d *= 2; o.push(v); } return o; }
};
const SERIES_POOL = { 1: ["arith"], 2: ["arith", "geo"], 3: ["arith", "geo", "incr", "inter"], 4: ["geo", "incr", "inter", "fib", "sq"], 5: ["incr", "inter", "fib", "sq", "affine", "altop", "dbl"] };
function runSeries() {
  openStage("Pattern Series");
  const L = S.levels.series, total = 8, limit = 30000;
  intro(`<div class="eyebrow">Fluid reasoning · level ${L}</div><h2>What comes next?</h2>
    <ul><li>Each row of numbers follows a hidden rule. Work it out and pick the next number.</li>
    <li>Rules can add, multiply, alternate between two sequences, or change the step each time.</li>
    <li>${total} puzzles, 30 seconds each. 7 or more correct moves you up a level.</li></ul>`, play);
  function play() {
    let i = -1, correct = 0, tid = null, cur = null;
    function next() {
      i++; if (i >= total) return end();
      meta(`${i + 1} / ${total} · ${correct} correct`);
      const full = SERIES[pick(SERIES_POOL[Math.min(L, 5)])](), ans = full[full.length - 1], terms = full.slice(0, -1);
      const last = terms[terms.length - 1], prev = terms[terms.length - 2], step = Math.max(1, Math.abs(ans - last));
      const cands = [last + (last - prev), ans + 1, ans - 1, ans + 2, ans - 2, ans + step, ans - step, Math.round(ans * 1.5), ans + 10];
      const opts = [ans];
      cands.forEach(c => { if (opts.length < 4 && c !== ans && !opts.includes(c)) opts.push(c); });
      cur = { ans: ans };
      body(`<div class="sr-terms">${terms.map(x => `<span>${x}</span>`).join("")}<span class="q">?</span></div><div class="bar"><i id="srBar"></i></div>
        <div class="opts">${shuffle(opts).map(o => `<button class="btn" data-o="${o}">${o}</button>`).join("")}</div>`);
      const bar = $("#srBar"); bar.style.transition = "none"; bar.style.width = "100%"; void bar.offsetWidth; bar.style.transition = `width ${limit}ms linear`; bar.style.width = "0%";
      $$("[data-o]").forEach(b => b.onclick = () => answer(+b.dataset.o, b));
      keyHandler = e => { const n = +e.key; const bs = $$("[data-o]"); if (n >= 1 && n <= bs.length) bs[n - 1].click(); };
      tid = later(() => answer(null, null), limit);
    }
    function answer(v, btn) {
      if (!cur) return; clearTimeout(tid);
      const ok = v === cur.ans; if (ok) correct++;
      $$("[data-o]").forEach(b => { b.disabled = true; if (+b.dataset.o === cur.ans) b.classList.add("ok"); });
      if (btn && !ok) btn.classList.add("no");
      $(".sr-terms .q").textContent = cur.ans; cur = null;
      later(next, ok ? 700 : 1500);
    }
    later(next, 200);
    function end() {
      const acc = correct / total;
      const ch = adapt("series", correct >= 7, correct <= 4, 1, 5);
      finish("series", { lvl: L, acc: acc });
      results("series", [["Correct", correct + "/" + total], ["Accuracy", pct(acc)]], ch, L >= 5 && ch !== "down" ? "You are at the top level. Keep accuracy at 100%." : "");
    }
  }
}

/* ---------- review ---------- */
function runReview() {
  openStage("Card Review");
  const due = shuffle(dueCards()).slice(0, 20);
  if (!due.length) {
    body(`<div class="res"><h2>Nothing due today</h2><p class="muted">Every card is scheduled for later. Add cards about what you are learning in the Cards tab so tomorrow's review has something new.</p><div class="row"><button class="btn primary big" id="ok">Mark review done</button></div></div>`);
    $("#ok").onclick = () => { finish("review", { lvl: 0, acc: null }); closeStage(); };
    return;
  }
  const queue = due.slice(), lapsed = new Set(); let known = 0, seen = 0;
  function next() {
    if (!queue.length) return end();
    const c = queue.shift(); meta(`${queue.length} left`);
    body(`<div class="fc"><div class="eyebrow">Recall it before you reveal</div><div class="front">${esc(c.front)}</div><div class="back" id="fcBack" hidden>${esc(c.back)}</div></div>
      <div class="row" id="fcA"><button class="btn primary big" id="rev">Show answer <kbd>Space</kbd></button></div>`);
    const reveal = () => {
      $("#fcBack").hidden = false;
      $("#fcA").innerHTML = `<button class="btn big" id="no">Didn't know <kbd>1</kbd></button><button class="btn primary big" id="yes">Knew it <kbd>2</kbd></button>`;
      $("#no").onclick = () => grade(false); $("#yes").onclick = () => grade(true);
      keyHandler = e => { if (e.key === "1") grade(false); else if (e.key === "2") grade(true); };
    };
    const grade = ok => {
      seen++; const t = today();
      if (ok) { if (!lapsed.has(c.id)) known++; c.box = Math.min(IV.length - 1, c.box + 1); c.due = addDays(t, IV[c.box]); }
      else { c.box = 0; c.due = addDays(t, 1); if (!lapsed.has(c.id)) { lapsed.add(c.id); queue.push(c); } }
      save(); next();
    };
    $("#rev").onclick = reveal;
    keyHandler = e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); reveal(); } };
  }
  next();
  function end() {
    const acc = known / due.length;
    finish("review", { lvl: due.length, acc: acc });
    results("review", [["Cards", due.length], ["Known first try", pct(acc)]], null, "Missed cards come back tomorrow. Known cards wait longer each time.");
  }
}

/* ---------- breathing timer ---------- */
function runBreath() {
  openStage("Breathing focus");
  body(`<div class="intro"><div class="eyebrow">Attention</div><h2>Focused-attention breathing</h2>
    <ul><li>Sit upright. Follow the circle: in for 4 seconds, out for 6.</li><li>When your mind wanders, notice it without judging and bring attention back to the breath. Each return is one repetition.</li></ul>
    <div class="row"><button class="btn primary big" data-m="10">10 minutes</button><button class="btn big" data-m="5">5 minutes</button></div></div>`);
  $$("[data-m]").forEach(b => b.onclick = () => go(+b.dataset.m));
  function go(mins) {
    const endAt = performance.now() + mins * 60000;
    body(`<div class="breath"><i id="dot"></i></div><div class="sp-msg" id="bMsg">Breathe in</div><div class="breath-t mono" id="bT"></div>`);
    const dot = $("#dot");
    const cycle = inhale => { $("#bMsg").textContent = inhale ? "Breathe in" : "Breathe out"; dot.style.transitionDuration = inhale ? "4s" : "6s"; dot.style.transform = inhale ? "scale(2.2)" : "scale(1)"; later(() => cycle(!inhale), inhale ? 4000 : 6000); };
    later(() => cycle(true), 50);
    const tick = () => {
      const left = Math.max(0, endAt - performance.now()), s = Math.ceil(left / 1000);
      $("#bT").textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
      if (left <= 0) {
        clearTimers(); if (mins >= 10) { dayRec(today()).habits.focus = true; save(); renderAll(); }
        body(`<div class="res"><h2>Session complete</h2><p class="muted">${mins >= 10 ? "Mindfulness habit checked off for today." : "Five minutes done. The habit counts at ten, so you can tick it yourself if you did more."}</p><div class="row"><button class="btn primary big" id="bd">Done</button></div></div>`);
        $("#bd").onclick = closeStage; return;
      }
      later(tick, 250);
    };
    tick();
  }
}

const RUN = { nback: runNback, "switch": runSwitch, math: runMath, span: runSpan, series: runSeries };
